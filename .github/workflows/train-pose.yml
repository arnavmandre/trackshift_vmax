name: Train new pretrained tyre pose model
on:
  push:
    paths: ['experiment.py', '.github/workflows/train-pose.yml', 'simulator/**', 'geometry.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tyre-pose-experiment
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      YOLO_AUTOINSTALL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover prepared simulation data
        uses: actions/download-artifact@v4
        with:
          repository: arnavmandre/vmax
          run-id: 34606745423
          name: retrained-model-blind-clips-and-review
          github-token: ${{ github.token }}
          path: .prepared
      - name: Retain development clips only
        run: |
          python - <<'PY'
          import pathlib,shutil
          pathlib.Path('data').mkdir(exist_ok=True)
          shutil.move('.prepared/retraining_out/development','data/development')
          shutil.rmtree('.prepared')
          PY
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'ultralytics==8.4.149' scipy pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify geometry and dataset conversion
        run: |
          python test_experiment.py
          python experiment.py prepare
          python -m pip freeze > experiment_out/environment.txt
      - name: Fine-tune new pretrained four-contact model
        run: python experiment.py train
      - name: Select on validation only
        run: python experiment.py select
      - name: Generate and evaluate fresh blind clips
        run: python experiment.py test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-tyre-pose-model-and-blind-evaluation
          path: experiment_out/
          retention-days: 30
      - name: Persist selected model and experiment evidence
        run: |
          python - <<'PY'
          import pathlib,shutil,json
          dst=pathlib.Path('trained_model');dst.mkdir(exist_ok=True)
          for name in ['selected.pt','selection.json','protocol.json','dataset_provenance.json','initialization.json','environment.txt','blind_predictions.json','blind_predictions.json.receipt.json']:
              shutil.copy2(pathlib.Path('experiment_out')/name,dst/name)
          shutil.copytree('experiment_out/blind_metrics',dst/'blind_metrics',dirs_exist_ok=True)
          shutil.copytree('experiment_out/fresh_blind',dst/'fresh_blind',dirs_exist_ok=True)
          result=json.loads((dst/'blind_metrics/evaluation.json').read_text())['summary']
          with open('EVENT_WORK.md','a') as f:
              f.write('\n## Completed new pose-model experiment\n\n')
              f.write('Fine-tuned official pretrained YOLO26 pose weights with a custom four-tyre layout. Earlier VMAX weights were not used. Simulator and development clips were reused with provenance disclosed.\n\n')
              f.write('Fresh synthetic blind metrics (not real-F1 accuracy):\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trained_model EVENT_WORK.md
          git commit -m 'Save newly fine-tuned tyre pose model and fresh blind evidence'
          git pull --rebase origin main
          git push origin HEAD:main
